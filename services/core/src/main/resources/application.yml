spring:
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 13MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${DATABASE_USERNAME:finance}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_WEB_CLIENT_ID:finance-web}
            client-secret: ${KEYCLOAK_WEB_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/finance}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/finance}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/finance/protocol/openid-connect/certs}
          audiences: ${FINANCE_API_AUDIENCE:finance-api}
finance:
  exports:
    service-token: ${FINANCE_EXPORTS_SERVICE_TOKEN:}
    storage:
      provider: ${FINANCE_EXPORTS_STORAGE_PROVIDER:}
      s3:
        endpoint: ${FINANCE_EXPORTS_S3_ENDPOINT:}
        region: ${FINANCE_EXPORTS_S3_REGION:us-east-1}
        bucket: ${FINANCE_EXPORTS_S3_BUCKET:}
        access-key: ${FINANCE_EXPORTS_S3_ACCESS_KEY:}
        secret-key: ${FINANCE_EXPORTS_S3_SECRET_KEY:}
        path-style: ${FINANCE_EXPORTS_S3_PATH_STYLE:true}
  receipts:
    storage:
      provider: ${FINANCE_RECEIPTS_STORAGE_PROVIDER:filesystem}
      filesystem-root: ${FINANCE_RECEIPTS_FILESYSTEM_ROOT:./var/receipt-objects}
      s3:
        endpoint: ${FINANCE_RECEIPTS_S3_ENDPOINT:}
        region: ${FINANCE_RECEIPTS_S3_REGION:us-east-1}
        bucket: ${FINANCE_RECEIPTS_S3_BUCKET:}
        access-key: ${FINANCE_RECEIPTS_S3_ACCESS_KEY:}
        secret-key: ${FINANCE_RECEIPTS_S3_SECRET_KEY:}
        path-style: ${FINANCE_RECEIPTS_S3_PATH_STYLE:true}
    scanner:
      clamav:
        host: ${FINANCE_CLAMAV_HOST:127.0.0.1}
        port: ${FINANCE_CLAMAV_PORT:3310}
        timeout: ${FINANCE_CLAMAV_TIMEOUT:PT10S}
    worker:
      enabled: ${FINANCE_RECEIPT_WORKER_ENABLED:true}
      poll-delay: ${FINANCE_RECEIPT_WORKER_POLL_DELAY:1000}
  analytics:
    price-history:
      url: ${FINANCE_ANALYTICS_URL:}
      service-token: ${FINANCE_ANALYTICS_SERVICE_TOKEN:}
      timeout: ${FINANCE_ANALYTICS_TIMEOUT:PT5S}
  telegram:
    service-token: ${FINANCE_TELEGRAM_SERVICE_TOKEN:}
  imports:
    parser:
      url: ${FINANCE_IMPORT_PARSER_URL:${FINANCE_AI_RECEIPT_URL:}}
      service-token: ${FINANCE_IMPORT_PARSER_SERVICE_TOKEN:${FINANCE_AI_SERVICE_TOKEN:}}
      timeout: ${FINANCE_IMPORT_PARSER_TIMEOUT:PT30S}
  ai:
    execution-policy: ${FINANCE_AI_POLICY:local-only}
    budget-proposal:
      url: ${FINANCE_AI_BUDGET_URL:}
      service-token: ${FINANCE_AI_SERVICE_TOKEN:}
      timeout: ${FINANCE_AI_REQUEST_TIMEOUT:PT95S}
    receipt-basket:
      url: ${FINANCE_AI_RECEIPT_URL:}
      service-token: ${FINANCE_AI_SERVICE_TOKEN:}
      timeout: ${FINANCE_AI_REQUEST_TIMEOUT:PT95S}
    receipt-ocr:
      url: ${FINANCE_AI_RECEIPT_OCR_URL:${FINANCE_AI_RECEIPT_URL:}}
      service-token: ${FINANCE_AI_RECEIPT_OCR_SERVICE_TOKEN:${FINANCE_AI_SERVICE_TOKEN:}}
      timeout: ${FINANCE_AI_RECEIPT_OCR_TIMEOUT:${FINANCE_AI_REQUEST_TIMEOUT:PT95S}}
    receipt-vision:
      url: ${FINANCE_AI_RECEIPT_VISION_URL:${FINANCE_AI_RECEIPT_URL:}}
      service-token: ${FINANCE_AI_RECEIPT_VISION_SERVICE_TOKEN:${FINANCE_AI_SERVICE_TOKEN:}}
      timeout: ${FINANCE_AI_RECEIPT_VISION_TIMEOUT:${FINANCE_AI_REQUEST_TIMEOUT:PT95S}}
    merchant-classification:
      url: ${FINANCE_AI_MERCHANT_URL:${FINANCE_AI_RECEIPT_URL:}}
      service-token: ${FINANCE_AI_SERVICE_TOKEN:}
      timeout: ${FINANCE_AI_REQUEST_TIMEOUT:PT95S}
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
