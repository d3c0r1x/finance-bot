openapi: 3.1.0
info:
  title: Finance Intelligence Internal API
  version: 1.0.0
  description: Private service contract. Never expose these operations to browser or Android clients.
paths:
  /healthz:
    get:
      operationId: intelligenceHealth
      responses:
        '200':
          description: Process is ready to receive internal requests
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /internal/v1/prices/compare:
    post:
      operationId: compareConfirmedReceiptPrice
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceCompareRequest' }
      responses:
        '200':
          description: Owner-scoped prior median and exact receipt-price history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceComparison' }
        '400': { description: Request is malformed or contains unknown fields }
        '401': { description: Internal service token is missing or invalid }
        '422': { description: Confirmed receipt item lacks a usable paid quantity or line sum }
        '503': { description: Price history is temporarily unavailable }
  /internal/v1/products/catalog:
    post:
      operationId: listMemberReceiptProducts
      security:
        - serviceBearer: []
      description: Reads only confirmed purchase points for the supplied tenant and already Core-resolved member ID. Blank query returns products with at least three purchases; search returns matches from one purchase.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCatalogRequest' }
      responses:
        '200':
          description: Bounded purchase catalog or search with actual history and cheapest observed merchant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductCatalogResponse' }
        '400': { description: Request is malformed or query exceeds 80 characters }
        '401': { description: Internal service token is missing or invalid }
        '503': { description: Product purchase history is temporarily unavailable }
  /internal/v1/shopping/candidates:
    post:
      operationId: listMemberShoppingCandidates
      security:
        - serviceBearer: []
      description: Derives due suggestions from confirmed receipt history for the tenant and Core-resolved member. It does not track home inventory.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShoppingCandidatesRequest' }
      responses:
        '200':
          description: Bounded purchase-rhythm suggestions with estimated cost
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingList' }
        '400': { description: Request is malformed or contains unknown fields }
        '401': { description: Internal service token is missing or invalid }
        '503': { description: Shopping history is temporarily unavailable }
  /internal/v1/analytics/recurring:
    post:
      operationId: getMemberRecurringProjection
      security:
        - serviceBearer: []
      description: Computes member-scoped weekly and monthly expense/income series from full transaction snapshots in ClickHouse. The owner ID must be resolved by Core.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurringRequest' }
      responses:
        '200':
          description: Versioned recurrence evidence, upcoming warnings, overdue items, and monthly expense estimates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringProjection' }
        '400': { description: Request is malformed or contains unknown fields }
        '401': { description: Internal service token is missing or invalid }
        '503': { description: Transaction history is unavailable or exceeds the supported bound }
  /internal/v1/analytics/waste:
    post:
      operationId: buildAdviceWasteReport
      security:
        - serviceBearer: []
      description: Computes versioned optional-spend evidence from receipt facts already authorized and decision-overlaid by Core. Go does not query business data.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WasteRequest' }
      responses:
        '200':
          description: Versioned reviewed spend, optional-spend evidence, corrections, and local-day series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WasteReport' }
        '400': { description: Request is malformed or contains invalid receipt facts }
        '401': { description: Internal service token is missing or invalid }
        '413': { description: Request exceeds the supported body size }
  /internal/v1/analytics/advice/f43:
    post:
      operationId: buildAdviceF43Report
      security:
        - serviceBearer: []
      description: Computes the savings ceiling, member-local weekly optional-spend trend and post-advice cadence from bounded, Core-authorized personal facts. Does not claim realized savings or causality.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/F43Request' }
      responses:
        '200':
          description: Versioned analytics with separate F42 recalculation impact and explicit completeness
          content:
            application/json:
              schema: { $ref: '#/components/schemas/F43Report' }
        '400': { description: Request is malformed or contains invalid purchase facts }
        '401': { description: Internal service token is missing or invalid }
        '413': { description: Request exceeds the supported body size }
  /internal/v1/analytics/recalculation-impact:
    post:
      operationId: calculateReceiptRecalculationImpact
      security:
        - serviceBearer: []
      description: Computes optional-spend before/after and delta from matching receipt facts with changed review verdicts only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecalculationImpactRequest' }
      responses:
        '200':
          description: Exact optional-spend impact and stable input fingerprint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecalculationImpact' }
        '400': { description: Before and after windows differ or financial receipt facts changed }
        '401': { description: Internal service token is missing or invalid }
        '413': { description: Request exceeds the supported body size }
  /internal/v1/analytics/advice/evidence-groups:
    post:
      operationId: groupAdviceEvidence
      security:
        - serviceBearer: []
      description: Groups bounded, Core-authorized confirmed receipt facts across purchase history. Model-only is evidence classification; Core owns all personal decisions and purchase visibility.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceRequest' }
      responses:
        '200':
          description: Versioned product evidence groups with model-only provenance kept separate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceResponse' }
        '400': { description: Request is malformed or contains invalid receipt facts }
        '401': { description: Internal service token is missing or invalid }
        '413': { description: Request exceeds the supported body size }
  /internal/v1/budget-proposals:
    post:
      operationId: createHistoryBudgetShares
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetProposalContext' }
      parameters:
        - { $ref: '#/components/parameters/AiTaskKind' }
        - { $ref: '#/components/parameters/AiInputSchemaVersion' }
        - { $ref: '#/components/parameters/AiOutputSchemaVersion' }
        - { $ref: '#/components/parameters/AiDeadline' }
        - { $ref: '#/components/parameters/AiExecutionPolicy' }
        - { $ref: '#/components/parameters/AiCorrelationId' }
        - { $ref: '#/components/parameters/AiRequiredCapabilities' }
      responses:
        '200':
          description: Validated category shares and model provenance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetProposalAdvice' }
        '400': { description: Request is not an allowlisted aggregate context }
        '401': { description: Internal service token is missing or invalid }
        '413': { description: Request exceeds the body limit }
        '403': { description: Effective AI policy denies the configured provider }
        '409': { description: Request was cancelled or correlation ID conflicts }
        '422': { description: Provider lacks a requested capability }
        '429': { description: Inference capacity is full }
        '502': { description: Model output is invalid }
        '503': { description: Inference provider is unavailable }
        '504': { description: Request deadline expired }
  /internal/v1/transaction-drafts:
    post:
      operationId: extractTextTransactionDraft
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionDraftContext' }
      parameters:
        - { $ref: '#/components/parameters/AiTaskKind' }
        - { $ref: '#/components/parameters/AiInputSchemaVersion' }
        - { $ref: '#/components/parameters/AiOutputSchemaVersion' }
        - { $ref: '#/components/parameters/AiDeadline' }
        - { $ref: '#/components/parameters/AiExecutionPolicy' }
        - { $ref: '#/components/parameters/AiCorrelationId' }
        - { $ref: '#/components/parameters/AiRequiredCapabilities' }
      responses:
        '200':
          description: Bounded extraction for user review; does not create a financial record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionDraftAdvice' }
        '400': { description: Context is invalid or contains fields outside the allowlist }
        '401': { description: Internal service token is missing or invalid }
        '413': { description: Request exceeds the body limit }
        '403': { description: Effective AI policy denies the configured provider }
        '409': { description: Request was cancelled or correlation ID conflicts }
        '422': { description: Provider lacks a requested capability }
        '429': { description: Inference capacity is full }
        '502': { description: Model output is invalid }
        '503': { description: Inference provider is unavailable }
        '504': { description: Request deadline expired }
  /internal/v1/receipts/ocr:
    post:
      operationId: extractReceiptTextLocally
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptOcrContext' }
      parameters:
        - { $ref: '#/components/parameters/AiTaskKind' }
        - { $ref: '#/components/parameters/AiInputSchemaVersion' }
        - { $ref: '#/components/parameters/AiOutputSchemaVersion' }
        - { $ref: '#/components/parameters/AiDeadline' }
        - { $ref: '#/components/parameters/AiExecutionPolicy' }
        - { $ref: '#/components/parameters/AiCorrelationId' }
        - { $ref: '#/components/parameters/AiRequiredCapabilities' }
      responses:
        '200':
          description: Local OCR text and word coordinates with Tesseract provenance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptOcrAdvice' }
        '400': { description: Image data or request envelope is invalid }
        '401': { description: Internal service token is missing or invalid }
        '403': { description: Effective AI policy denies the selected provider }
        '409': { description: Request was cancelled or correlation ID conflicts }
        '413': { description: Encoded image exceeds the body limit }
        '422': { description: Provider lacks a requested capability }
        '429': { description: Inference or OCR capacity is full }
        '502': { description: OCR provider output is invalid }
        '503': { description: Tesseract binary or language data is unavailable }
        '504': { description: Request deadline or Tesseract timeout expired }
  /internal/v1/receipts/vision:
    post:
      operationId: readReceiptWithAllowlistedVisionModel
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptOcrContext' }
      parameters:
        - { $ref: '#/components/parameters/AiTaskKind' }
        - { $ref: '#/components/parameters/AiInputSchemaVersion' }
        - { $ref: '#/components/parameters/AiOutputSchemaVersion' }
        - { $ref: '#/components/parameters/AiDeadline' }
        - { $ref: '#/components/parameters/AiExecutionPolicy' }
        - { $ref: '#/components/parameters/AiCorrelationId' }
        - { $ref: '#/components/parameters/AiRequiredCapabilities' }
      responses:
        '200':
          description: Validated receipt reading draft with allowlisted model provenance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptVisionAdvice' }
        '400': { description: Image data or request envelope is invalid }
        '401': { description: Internal service token is missing or invalid }
        '403': { description: Effective AI policy denies the selected provider }
        '409': { description: Request was cancelled or correlation ID conflicts }
        '413': { description: Encoded image exceeds the body limit }
        '422': { description: No allowlisted provider supports vision and structured output }
        '429': { description: Inference capacity is full }
        '502': { description: Vision output is invalid }
        '503': { description: Vision provider is unavailable }
        '504': { description: Request deadline expired }
  /internal/v1/receipts/basket-review:
    post:
      operationId: suggestReceiptBasketReview
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptBasketContext' }
      parameters:
        - { $ref: '#/components/parameters/AiTaskKind' }
        - { $ref: '#/components/parameters/AiInputSchemaVersion' }
        - { $ref: '#/components/parameters/AiOutputSchemaVersion' }
        - { $ref: '#/components/parameters/AiDeadline' }
        - { $ref: '#/components/parameters/AiExecutionPolicy' }
        - { $ref: '#/components/parameters/AiCorrelationId' }
        - { $ref: '#/components/parameters/AiRequiredCapabilities' }
      responses:
        '200':
          description: Amount-free per-line suggestion with model provenance; Java applies deterministic safeguards
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptBasketAdvice' }
        '400': { description: Context or request envelope is invalid }
        '401': { description: Internal service token is missing or invalid }
        '403': { description: Effective AI policy denies the selected provider }
        '409': { description: Request was cancelled or correlation ID conflicts }
        '413': { description: Request exceeds the body limit }
        '422': { description: Provider lacks text and structured output }
        '429': { description: Inference capacity is full }
        '502': { description: Model output is invalid }
        '503': { description: Inference provider is unavailable }
        '504': { description: Request deadline expired }
  /internal/v1/merchant-classifications:
    post:
      operationId: classifyMerchantsInBatch
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantClassificationContext' }
      parameters:
        - { $ref: '#/components/parameters/AiTaskKind' }
        - { $ref: '#/components/parameters/AiInputSchemaVersion' }
        - { $ref: '#/components/parameters/AiOutputSchemaVersion' }
        - { $ref: '#/components/parameters/AiDeadline' }
        - { $ref: '#/components/parameters/AiExecutionPolicy' }
        - { $ref: '#/components/parameters/AiCorrelationId' }
        - { $ref: '#/components/parameters/AiRequiredCapabilities' }
      responses:
        '200':
          description: Validated category hypotheses for at most 50 merchant names, with provider provenance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantClassificationAdvice' }
        '400': { description: Context or request envelope is invalid }
        '401': { description: Internal service token is missing or invalid }
        '403': { description: Effective AI policy denies the selected provider }
        '409': { description: Request was cancelled or correlation ID conflicts }
        '413': { description: Request exceeds the body limit }
        '422': { description: Provider lacks text and structured output }
        '429': { description: Inference capacity is full }
        '502': { description: Model output is invalid }
        '503': { description: Inference provider is unavailable }
        '504': { description: Request deadline expired }
  /internal/v1/jobs/{correlationId}/cancel:
    post:
      operationId: cancelIntelligenceJob
      security:
        - serviceBearer: []
      parameters:
        - name: correlationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cancellation was accepted for an active request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: cancellation_requested }
        '401': { description: Internal service token is missing or invalid }
        '404': { description: No active request has this correlation ID }
components:
  parameters:
    AiTaskKind:
      name: X-Finance-Task-Kind
      in: header
      required: true
      schema: { type: string, enum: [budget-proposal, transaction-draft, receipt-ocr, receipt-vision, merchant-classification] }
    AiInputSchemaVersion:
      name: X-Finance-Input-Schema-Version
      in: header
      required: true
      schema:
        type: string
        enum: [budget-proposal-context.v1, transaction-draft-context.v1, receipt-ocr-context.v1,
               receipt-vision-context.v1, merchant-classification-context.v1]
    AiOutputSchemaVersion:
      name: X-Finance-Output-Schema-Version
      in: header
      required: true
      schema:
        type: string
        enum: [budget-proposal-advice.v1, transaction-draft-advice.v1, receipt-ocr-result.v1,
               receipt-vision-result.v1, merchant-classification-result.v1]
    AiDeadline:
      name: X-Finance-Deadline-Unix-Ms
      in: header
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    AiExecutionPolicy:
      name: X-Finance-AI-Policy
      in: header
      required: true
      schema: { type: string, enum: [local-only, cloud-opt-in] }
    AiCorrelationId:
      name: X-Finance-Correlation-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
    AiRequiredCapabilities:
      name: X-Finance-Required-Capabilities
      in: header
      required: true
      description: Comma-separated capabilities required from selected model
      schema: { type: string, minLength: 1, example: 'text,structured_output' }
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
  schemas:
    MerchantClassificationContext:
      type: object
      additionalProperties: false
      required: [merchants]
      properties:
        merchants:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
    MerchantClassificationAdvice:
      type: object
      additionalProperties: false
      required: [provider, classifications, modelVersion, promptVersion, taskKind, inputSchemaVersion,
                 outputSchemaVersion, correlationId, executionPolicy, requiredCapabilities, capabilities,
                 latencyMs, usage, fallbackReason, provenance]
      properties:
        provider: { type: string, minLength: 1, maxLength: 64 }
        classifications:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/MerchantClassification' }
        modelVersion: { type: string, minLength: 1, maxLength: 128 }
        promptVersion: { type: string, const: merchant-category.v1 }
        taskKind: { type: string, const: merchant-classification }
        inputSchemaVersion: { type: string, const: merchant-classification-context.v1 }
        outputSchemaVersion: { type: string, const: merchant-classification-result.v1 }
        correlationId: { type: string, format: uuid }
        executionPolicy: { type: string, enum: [local-only, cloud-opt-in] }
        requiredCapabilities:
          type: array
          uniqueItems: true
          items: { type: string, enum: [text, structured_output] }
        capabilities:
          type: array
          uniqueItems: true
          items: { type: string, enum: [text, structured_output, vision] }
        latencyMs: { type: integer, minimum: 0 }
        usage: { $ref: '#/components/schemas/AiUsage' }
        fallbackReason: { type: [string, 'null'] }
        provenance: { $ref: '#/components/schemas/AiProvenance' }
    MerchantClassification:
      type: object
      additionalProperties: false
      required: [merchant, categoryCode, confidence]
      properties:
        merchant: { type: string, minLength: 1, maxLength: 200 }
        categoryCode: { type: string, enum: [еда, транспорт, жилье, досуг, одежда, здоровье, работа, техника, долги, прочее] }
        confidence: { type: string, pattern: '^(?:0\\.[0-9]{3}|1\\.000)$' }
    PriceCompareRequest:
      type: object
      additionalProperties: false
      required: [tenantId, ownerUserId, receiptId, itemId, name, quantity, lineSum, currency, purchasedAt]
      properties:
        tenantId: { type: string, format: uuid }
        ownerUserId: { type: string, format: uuid }
        receiptId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        quantity: { type: string, pattern: '^(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,6})?$' }
        lineSum: { type: string, pattern: '^(?:0|[1-9][0-9]{0,17})(?:\.[0-9]{1,2})?$' }
        currency: { type: string, const: RUB }
        purchasedAt: { type: string, format: date-time }
    ProductCatalogRequest:
      type: object
      additionalProperties: false
      required: [tenantId, ownerUserId, query]
      properties:
        tenantId: { type: string, format: uuid }
        ownerUserId: { type: string, format: uuid }
        query: { type: string, maxLength: 80 }
    ShoppingCandidatesRequest:
      type: object
      additionalProperties: false
      required: [tenantId, ownerUserId]
      properties:
        tenantId: { type: string, format: uuid }
        ownerUserId: { type: string, format: uuid }
      description: ownerUserId must be resolved by Core from the authenticated active member; callers cannot select another scope.
    RecurringRequest:
      type: object
      additionalProperties: false
      required: [tenantId, ownerUserId, asOf, timeZone]
      properties:
        tenantId: { type: string, format: uuid }
        ownerUserId: { type: string, format: uuid }
        asOf: { type: string, format: date-time }
        timeZone: { type: string, minLength: 1, maxLength: 64, description: IANA timezone from the active member profile. }
      description: ownerUserId and timeZone must be resolved by Core from the authenticated active member.
    RecurringProjection:
      type: object
      additionalProperties: false
      required: [algorithm_version, completeness, time_zone, as_of, expense_series, income_series, due_soon,
                 overdue, next_income, monthly_expense_estimate, monthly_expense_estimates]
      properties:
        algorithm_version: { type: string, const: recurring.v1 }
        completeness: { type: string, const: complete }
        time_zone: { type: string, minLength: 1, maxLength: 64 }
        as_of: { type: string, format: date-time }
        expense_series:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/RecurringSeries' }
        income_series:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/RecurringSeries' }
        due_soon:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/RecurringSeries' }
        overdue:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/RecurringSeries' }
        next_income: { oneOf: [{ $ref: '#/components/schemas/RecurringSeries' }, { type: 'null' }] }
        monthly_expense_estimate: { oneOf: [{ $ref: '#/components/schemas/MoneyAmount' }, { type: 'null' }] }
        monthly_expense_estimates:
          type: object
          maxProperties: 8
          propertyNames: { pattern: '^[A-Z]{3}$' }
          additionalProperties: { $ref: '#/components/schemas/MoneyAmount' }
      description: No series yields empty lists and null totals. Cross-currency totals are reported by currency only.
    EvidenceRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50000
          items: { $ref: '#/components/schemas/EvidenceLine' }
      description: Core selects confirmed receipt items tied to posted personal expenses. Go cannot authorize callers or mutate decisions.
    EvidenceLine:
      type: object
      additionalProperties: false
      required: [itemId, productKey, name, lineSum, verdict, verdictSource, advice, purchasedAt, itemVersion]
      properties:
        itemId: { type: string, format: uuid }
        productKey: { type: string, maxLength: 256, pattern: '^[a-zа-я0-9]*$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        lineSum: { type: [string, 'null'], pattern: '^(?:0|[1-9][0-9]{0,17})\.\d{2}$' }
        verdict: { type: string, enum: [useful, neutral, harmful, unnecessary, ''] }
        verdictSource: { type: string, maxLength: 32 }
        advice: { type: string, maxLength: 500 }
        purchasedAt: { type: string, format: date-time }
        itemVersion: { type: integer, minimum: 1 }
    EvidenceResponse:
      type: object
      additionalProperties: false
      required: [algorithmVersion, inputVersion, groups]
      properties:
        algorithmVersion: { type: string, const: advice-evidence.v1 }
        inputVersion: { type: string, pattern: '^[0-9a-f]{64}$' }
        groups:
          type: array
          maxItems: 25000
          items: { $ref: '#/components/schemas/EvidenceGroup' }
      description: Empty groups mean no product has two optional verdicts; no personal block is implied.
    EvidenceGroup:
      type: object
      additionalProperties: false
      required: [productKey, productName, count, amount, missingAmountCount, ruleCount, modelCount,
                 unmarkedCount, modelOnly, latestVerdict, latestAdvice, lastPurchasedAt]
      properties:
        productKey: { type: string, minLength: 1, maxLength: 256, pattern: '^[a-zа-я0-9]+$' }
        productName: { type: string, minLength: 1, maxLength: 200 }
        count: { type: integer, minimum: 2, maximum: 50000 }
        amount: { type: [string, 'null'], pattern: '^\d+\.\d{2}$', description: Null if any contributing receipt amount is missing. }
        missingAmountCount: { type: integer, minimum: 0, maximum: 50000 }
        ruleCount: { type: integer, minimum: 0, maximum: 50000 }
        modelCount: { type: integer, minimum: 0, maximum: 50000 }
        unmarkedCount: { type: integer, minimum: 0, maximum: 50000, description: Default, human, unknown or absent source. }
        modelOnly: { type: boolean, description: True only when every contributing optional verdict came from a model; never a block decision. }
        latestVerdict: { type: string, enum: [harmful, unnecessary] }
        latestAdvice: { type: string, maxLength: 500 }
        lastPurchasedAt: { type: string, format: date-time }
    WasteRequest:
      type: object
      additionalProperties: false
      required: [fromDate, toDate, asOf, timeZone, items]
      properties:
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        asOf: { type: string, format: date-time }
        timeZone: { type: string, minLength: 1, maxLength: 64, description: IANA timezone resolved by Core. }
        items:
          type: array
          maxItems: 50000
          items: { $ref: '#/components/schemas/WasteLine' }
      description: Core sends only confirmed expense receipt items in the authorized date and member scope; allowed is resolved against each receipt owner's current decision.
    F43Request:
      type: object
      additionalProperties: false
      required: [inputWatermark, asOf, timeZone, items, recalculations]
      properties:
        inputWatermark: { type: string, pattern: '^[1-9][0-9]{0,19}$', description: Monotonically increasing Core snapshot version; encoded as text to avoid JS integer loss. }
        asOf: { type: string, format: date-time }
        timeZone: { type: string, minLength: 1, maxLength: 64, description: IANA timezone resolved by Core. }
        income: { type: [string, 'null'], pattern: '^\d+\.\d{2}$' }
        monthlyLimit: { type: [string, 'null'], pattern: '^\d+\.\d{2}$' }
        items:
          type: array
          maxItems: 50000
          items: { $ref: '#/components/schemas/F43Item' }
        recalculations:
          type: array
          maxItems: 50000
          items: { $ref: '#/components/schemas/F43Recalculation' }
      description: Core sends only confirmed personal purchase facts and the member's F42 changes. AdviceGiven is true only for advice actually shown when the purchase was recorded.
    F43Item:
      type: object
      additionalProperties: false
      required: [itemId, productKey, name, lineSum, verdict, advice, adviceGiven, allowed, purchasedAt]
      properties:
        itemId: { type: string, format: uuid }
        productKey: { type: string, maxLength: 256, pattern: '^[a-zа-я0-9]*$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        lineSum: { type: [string, 'null'], pattern: '^\d{1,18}\.\d{2}$' }
        verdict: { type: [string, 'null'], enum: [harmful, unnecessary, useful, neutral, null] }
        advice: { type: string, maxLength: 500 }
        adviceGiven: { type: boolean, description: False for verdicts introduced by F42 recalculation. }
        allowed: { type: boolean, description: Current member decision; used for the savings ceiling only. }
        purchasedAt: { type: string, format: date-time }
    F43Recalculation:
      type: object
      additionalProperties: false
      required: [changedAt, changedItemCount, optionalSpendDelta]
      properties:
        changedAt: { type: string, format: date-time }
        changedItemCount: { type: integer, minimum: 0, maximum: 50000 }
        optionalSpendDelta: { type: [string, 'null'], pattern: '^-?\d{1,18}\.\d{2}$' }
    F43Report:
      type: object
      additionalProperties: false
      required: [algorithmVersion, inputWatermark, completeness, reasonCode, savings, trend, effects, recalculation]
      properties:
        algorithmVersion: { type: string, const: advice-f43.v1 }
        inputWatermark: { type: string, pattern: '^[1-9][0-9]{0,19}$' }
        completeness: { type: string, enum: [complete, partial] }
        reasonCode: { type: string, enum: [available, insufficient_history, missing_amounts, too_many_items, analytics_unavailable] }
        savings: { $ref: '#/components/schemas/F43SavingsReport' }
        trend: { $ref: '#/components/schemas/F43TrendReport' }
        effects: { $ref: '#/components/schemas/F43EffectsReport' }
        recalculation: { $ref: '#/components/schemas/F43RecalculationReport' }
    F43SavingsReport:
      type: object
      additionalProperties: false
      required: [available, reasonCode, label, days, monthlyCeiling, shareOfIncome, shareOfLimit, groups]
      properties:
        available: { type: boolean }
        reasonCode: { type: string, enum: [available, insufficient_history, missing_amounts] }
        label: { type: string, const: theoretical_ceiling_not_actual_savings }
        days: { type: integer, const: 90 }
        monthlyCeiling: { type: [string, 'null'], pattern: '^\d{1,18}\.\d{2}$' }
        shareOfIncome: { type: [string, 'null'], pattern: '^\d{1,18}\.\d$' }
        shareOfLimit: { type: [string, 'null'], pattern: '^\d{1,18}\.\d$' }
        groups:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/F43SavingsGroup' }
    F43SavingsGroup:
      type: object
      additionalProperties: false
      required: [productKey, name, count, spend, monthlyCeiling]
      properties:
        productKey: { type: string, maxLength: 256 }
        name: { type: string, minLength: 1, maxLength: 200 }
        count: { type: integer, minimum: 2, maximum: 50000 }
        spend: { type: string, pattern: '^\d{1,18}\.\d{2}$' }
        monthlyCeiling: { type: string, pattern: '^\d{1,18}\.\d{2}$' }
    F43TrendReport:
      type: object
      additionalProperties: false
      required: [available, reasonCode, weeks, delta, direction]
      properties:
        available: { type: boolean }
        reasonCode: { type: string, enum: [available, insufficient_history, missing_amounts] }
        weeks:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/F43TrendWeek' }
        delta: { type: [string, 'null'], pattern: '^-?\d+\.\d{3}$' }
        direction: { type: string, enum: ['', steady, down, up] }
    F43TrendWeek:
      type: object
      additionalProperties: false
      required: [start, end, spend, optionalSpend, optionalShare, itemCount, recalculated]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
        spend: { type: string, pattern: '^\d{1,18}\.\d{2}$' }
        optionalSpend: { type: string, pattern: '^\d{1,18}\.\d{2}$' }
        optionalShare: { type: string, pattern: '^\d+\.\d{3}$' }
        itemCount: { type: integer, minimum: 1, maximum: 50000 }
        recalculated: { type: boolean }
    F43EffectsReport:
      type: object
      additionalProperties: false
      required: [effects, pending, causalityClaim]
      properties:
        effects:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/F43Effect' }
        pending:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/F43PendingEffect' }
        causalityClaim: { type: boolean, const: false }
    F43Effect:
      type: object
      additionalProperties: false
      required: [productKey, name, advice, beforeCount, afterCount, daysBefore, daysAfter, intervalBefore, intervalAfter, change, direction, afterSpend]
      properties:
        productKey: { type: string, maxLength: 256 }
        name: { type: string, minLength: 1, maxLength: 200 }
        advice: { type: string, maxLength: 500 }
        beforeCount: { type: integer, minimum: 2, maximum: 50000 }
        afterCount: { type: integer, minimum: 0, maximum: 50000 }
        daysBefore: { type: integer, minimum: 1 }
        daysAfter: { type: integer, minimum: 21 }
        intervalBefore: { type: string, pattern: '^\d+\.\d$' }
        intervalAfter: { type: [string, 'null'], pattern: '^\d+\.\d$' }
        change: { type: string, pattern: '^-?\d+\.\d{2}$' }
        direction: { type: string, enum: [less_often, same_frequency, more_often] }
        afterSpend: { type: [string, 'null'], pattern: '^\d{1,18}\.\d{2}$' }
    F43PendingEffect:
      type: object
      additionalProperties: false
      required: [productKey, name, daysAfter, daysLeft]
      properties:
        productKey: { type: string, maxLength: 256 }
        name: { type: string, minLength: 1, maxLength: 200 }
        daysAfter: { type: integer, minimum: 0, maximum: 20 }
        daysLeft: { type: integer, minimum: 1, maximum: 21 }
    F43RecalculationReport:
      type: object
      additionalProperties: false
      required: [available, changedItemCount, optionalSpendDelta, windows]
      properties:
        available: { type: boolean }
        changedItemCount: { type: integer, minimum: 0, maximum: 2500000000 }
        optionalSpendDelta: { type: [string, 'null'], pattern: '^-?\d{1,18}\.\d{2}$' }
        windows:
          type: array
          maxItems: 50000
          items: { $ref: '#/components/schemas/F43RecalculationWindow' }
    F43RecalculationWindow:
      type: object
      additionalProperties: false
      required: [start, end, changedItemCount, optionalSpendDelta]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
        changedItemCount: { type: integer, minimum: 0, maximum: 2500000000 }
        optionalSpendDelta: { type: [string, 'null'], pattern: '^-?\d{1,18}\.\d{2}$' }
    RecalculationImpactRequest:
      type: object
      additionalProperties: false
      required: [before, after]
      properties:
        before: { $ref: '#/components/schemas/WasteRequest' }
        after: { $ref: '#/components/schemas/WasteRequest' }
    RecalculationImpact:
      type: object
      additionalProperties: false
      required: [algorithmVersion, inputVersion, reasonCode, completeness,
                 optionalSpendBefore, optionalSpendAfter, optionalSpendDelta]
      properties:
        algorithmVersion: { type: string, const: receipt-recalculation-impact.v1 }
        inputVersion: { type: string, pattern: '^[0-9a-f]{64}$' }
        reasonCode: { type: string, enum: [available, no_reviewed_items, missing_amounts, analytics_unavailable] }
        completeness: { type: string, enum: [complete, partial] }
        optionalSpendBefore: { type: [string, 'null'], pattern: '^\\d+\\.\\d{2}$' }
        optionalSpendAfter: { type: [string, 'null'], pattern: '^\\d+\\.\\d{2}$' }
        optionalSpendDelta: { type: [string, 'null'], pattern: '^-?\\d+\\.\\d{2}$' }
    WasteLine:
      type: object
      additionalProperties: false
      required: [itemId, productKey, name, lineSum, verdict, verdictSource, purchasedAt, allowed, itemVersion, decisionVersion]
      properties:
        itemId: { type: string, format: uuid }
        productKey: { type: string, maxLength: 256, pattern: '^[a-zа-я0-9]*$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        lineSum: { type: [string, 'null'], pattern: '^(?:0|[1-9][0-9]{0,17})\.\d{2}$' }
        verdict: { type: [string, 'null'], enum: [useful, neutral, harmful, unnecessary, null] }
        verdictSource: { type: string, maxLength: 32, description: Unknown or absent provenance is reported as unknown. }
        purchasedAt: { type: string, format: date-time }
        allowed: { type: boolean, description: Current allow decision for this receipt owner and product key. }
        itemVersion: { type: integer, minimum: 1 }
        decisionVersion: { type: integer, minimum: 0 }
    WasteReport:
      type: object
      additionalProperties: false
      required: [available, reasonCode, algorithmVersion, completeness, asOf, inputVersion, fromDate, toDate,
                 reviewedSpend, optionalSpend, optionalShare, reviewedItemCount, optionalItemCount, missingAmountCount,
                 byVerdict, bySource, topItems, repeats, corrected, optionalByDay]
      properties:
        available: { type: boolean }
        reasonCode: { type: string, enum: [available, no_reviewed_items, missing_amounts] }
        algorithmVersion: { type: string, const: advice-waste.v1 }
        completeness: { type: string, enum: [complete, partial] }
        asOf: { type: string, format: date-time }
        inputVersion: { type: string, pattern: '^[0-9a-f]{64}$' }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        reviewedSpend: { type: [string, 'null'], pattern: '^\d+\.\d{2}$' }
        optionalSpend: { type: [string, 'null'], pattern: '^\d+\.\d{2}$' }
        optionalShare: { type: [string, 'null'], pattern: '^\d+\.\d{3}$', description: Fraction from 0 to 1; rounded half-even. }
        reviewedItemCount: { type: integer, minimum: 0, maximum: 50000 }
        optionalItemCount: { type: integer, minimum: 0, maximum: 50000 }
        missingAmountCount: { type: integer, minimum: 0, maximum: 50000 }
        byVerdict:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/WasteVerdictTotal' }
        bySource:
          type: object
          maxProperties: 5
          propertyNames: { enum: [rule, model, default, unknown, human] }
          additionalProperties: { type: string, pattern: '^\d+\.\d{2}$' }
        topItems:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/WasteItemSummary' }
        repeats:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/WasteProductGroup' }
        corrected:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/WasteProductGroup' }
        optionalByDay:
          type: object
          maxProperties: 366
          propertyNames: { pattern: '^\d{4}-\d{2}-\d{2}$' }
          additionalProperties: { type: string, pattern: '^\d+\.\d{2}$' }
      description: Null verdicts are excluded from the evidence denominator. Missing amounts make the summary unavailable rather than fabricating totals.
    WasteVerdictTotal:
      type: object
      additionalProperties: false
      required: [verdict, amount, count]
      properties:
        verdict: { type: string, enum: [harmful, unnecessary] }
        amount: { type: string, pattern: '^\d+\.\d{2}$' }
        count: { type: integer, minimum: 1, maximum: 50000 }
    WasteItemSummary:
      type: object
      additionalProperties: false
      required: [itemId, name, amount, verdict, source]
      properties:
        itemId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        amount: { type: string, pattern: '^\d+\.\d{2}$' }
        verdict: { type: string, enum: [harmful, unnecessary] }
        source: { type: string, enum: [rule, model, default, unknown, human] }
    WasteProductGroup:
      type: object
      additionalProperties: false
      required: [productKey, productName, count, amount]
      properties:
        productKey: { type: string, maxLength: 256, pattern: '^[a-zа-я0-9]*$' }
        productName: { type: string, minLength: 1, maxLength: 200 }
        count: { type: integer, minimum: 1, maximum: 50000 }
        amount: { type: string, pattern: '^\d+\.\d{2}$' }
    RecurringSeries:
      type: object
      additionalProperties: false
      required: [id, key, name, type, currency, amount, min_amount, max_amount, period_code, period_days,
                 min_interval_days, max_interval_days, occurrences, last_date, next_date, days_until]
      properties:
        id: { type: string, pattern: '^[0-9a-f]{32}$' }
        key: { type: string, minLength: 1, maxLength: 512 }
        name: { type: string, minLength: 1, maxLength: 500 }
        category: { type: string, maxLength: 64 }
        type: { type: string, enum: [expense, income] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        min_amount: { $ref: '#/components/schemas/MoneyAmount' }
        max_amount: { $ref: '#/components/schemas/MoneyAmount' }
        period_code: { type: string, enum: [week, month] }
        period_days: { type: integer, minimum: 6, maximum: 35 }
        min_interval_days: { type: integer, minimum: 1, maximum: 3650 }
        max_interval_days: { type: integer, minimum: 1, maximum: 3650 }
        occurrences: { type: integer, minimum: 3, maximum: 5000 }
        last_date: { type: string, format: date }
        next_date: { type: string, format: date }
        days_until: { type: integer, minimum: -3650, maximum: 3650 }
    ProductCatalogResponse:
      type: object
      additionalProperties: false
      required: [mode, query, products]
      properties:
        mode: { type: string, enum: [catalog, search] }
        query: { type: string, maxLength: 80 }
        products:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ProductCatalogCard' }
      allOf:
        - if:
            properties: { mode: { const: search } }
            required: [mode]
          then:
            properties:
              products: { maxItems: 5 }
        - if:
            properties: { mode: { const: catalog } }
            required: [mode]
          then:
            properties:
              products:
                items:
                  properties:
                    purchaseCount: { minimum: 3 }
      description: Search returns at most five cards; catalog requires three confirmed purchases and search requires one.
    ProductCatalogCard:
      type: object
      additionalProperties: false
      required: [productName, purchaseCount, usualUnitPrice, hasBaseline, baselineUnitPrice, lastUnitPrice,
                 lastPurchasedAt, lastMerchant, cheapestUnitPrice, cheapestMerchant, totalSpent, change, relative,
                 signal, direction, priorPurchases, chartAvailable, history]
      properties:
        productName: { type: string, minLength: 1, maxLength: 200 }
        purchaseCount: { type: integer, minimum: 1, maximum: 5000 }
        usualUnitPrice: { type: string, pattern: '^\d{1,30}\.\d{6}$' }
        hasBaseline: { type: boolean }
        baselineUnitPrice: { type: [string, 'null'], pattern: '^\d{1,30}\.\d{6}$' }
        lastUnitPrice: { type: string, pattern: '^\d{1,30}\.\d{6}$' }
        lastPurchasedAt: { type: string, format: date-time }
        lastMerchant: { type: [string, 'null'], maxLength: 200 }
        cheapestUnitPrice: { type: string, pattern: '^\d{1,30}\.\d{6}$' }
        cheapestMerchant: { type: [string, 'null'], maxLength: 200 }
        totalSpent: { type: string, pattern: '^\d{1,22}\.\d{2}$' }
        change: { type: [string, 'null'], pattern: '^-?\d{1,30}\.\d{6}$' }
        relative: { type: [string, 'null'], pattern: '^-?\d{1,45}\.\d{6}$' }
        signal: { type: boolean }
        direction: { type: [string, 'null'], enum: [up, down, null] }
        priorPurchases: { type: integer, minimum: 0, maximum: 4999 }
        chartAvailable: { type: boolean, description: True only when at least two real receipt points are present. }
        history:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: '#/components/schemas/PriceHistoryPoint' }
    ShoppingList:
      type: object
      additionalProperties: false
      required: [candidates, estimatedListCost, inventoryTracked]
      properties:
        candidates:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ShoppingCandidate' }
        estimatedListCost: { type: string, pattern: '^\d{1,22}\.\d{2}$' }
        inventoryTracked: { type: boolean, const: false, description: Finance does not know what is currently at home. }
      description: Purchase suggestions from receipt rhythm; this response is never a home-inventory record.
    ShoppingCandidate:
      type: object
      additionalProperties: false
      required: [productName, purchaseCount, medianIntervalDays, usualUnitPrice, estimatedCost,
                 lastPurchasedAt, dueAt, daysUntilDue]
      properties:
        productName: { type: string, minLength: 1, maxLength: 200 }
        purchaseCount: { type: integer, minimum: 3, maximum: 5000 }
        medianIntervalDays: { type: integer, minimum: 3, maximum: 3650 }
        usualUnitPrice: { type: string, pattern: '^\d{1,30}\.\d{6}$' }
        estimatedCost: { type: string, pattern: '^\d{1,22}\.\d{2}$' }
        lastPurchasedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        daysUntilDue: { type: integer, minimum: -7300, maximum: 3 }
    PriceComparison:
      type: object
      additionalProperties: false
      required: [algorithmVersion, productName, hasBaseline, currentUnitPrice, baselineUnitPrice, change, relative,
                 signal, direction, priorPurchases, history]
      properties:
        algorithmVersion: { type: string, const: price-projection.v1 }
        productName: { type: string, minLength: 1, maxLength: 200 }
        hasBaseline: { type: boolean }
        currentUnitPrice: { type: string, pattern: '^\d{1,24}\.\d{6}$' }
        baselineUnitPrice:
          type: [string, 'null']
          pattern: '^\d{1,24}\.\d{6}$'
          description: Median price for matching earlier purchases by this same member; null without history.
        change:
          type: [string, 'null']
          pattern: '^-?\d{1,24}\.\d{6}$'
          description: Current unit price minus the baseline; null without history.
        relative:
          type: [string, 'null']
          pattern: '^-?\d{1,40}\.\d{6}$'
          description: Fractional change from baseline; 0.125000 means 12.5 percent.
        signal: { type: boolean, description: True only when both RUB 10 and 12 percent thresholds are met. }
        direction:
          type: [string, 'null']
          enum: [up, down, null]
          description: Significant movement direction; null when no signal exists.
        priorPurchases:
          type: integer
          minimum: 0
          maximum: 5000
          description: Count of matching earlier purchases for this member.
        history:
          type: array
          maxItems: 5001
          description: Matching price points in time order, followed by the current receipt item.
          items: { $ref: '#/components/schemas/PriceHistoryPoint' }
    PriceHistoryPoint:
      type: object
      additionalProperties: false
      required: [receiptId, itemId, purchasedAt, merchant, name, unitPrice, current]
      properties:
        receiptId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        purchasedAt: { type: string, format: date-time }
        merchant: { type: [string, 'null'], maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 200 }
        unitPrice: { type: string, pattern: '^\d{1,24}\.\d{6}$' }
        current: { type: boolean }
    MoneyAmount:
      type: string
      pattern: '^\d{1,18}(?:\.\d{1,2})?$'
    MonthlyExpenseByCategory:
      type: object
      additionalProperties: { $ref: '#/components/schemas/MoneyAmount' }
    BudgetProposalContext:
      type: object
      additionalProperties: false
      required: [monthlyIncome, historyDays, categoryCodes, monthlyExpenseByMonth,
                 monthlyIncomeByMonth, currentFamilyLimits]
      properties:
        monthlyIncome: { $ref: '#/components/schemas/MoneyAmount' }
        historyDays: { type: integer, minimum: 30, maximum: 3660 }
        categoryCodes:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        monthlyExpenseByMonth:
          type: object
          maxProperties: 4
          propertyNames: { pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
          additionalProperties: { $ref: '#/components/schemas/MonthlyExpenseByCategory' }
        monthlyIncomeByMonth:
          type: object
          maxProperties: 4
          propertyNames: { pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
          additionalProperties: { $ref: '#/components/schemas/MoneyAmount' }
        currentFamilyLimits:
          type: object
          additionalProperties: { $ref: '#/components/schemas/MoneyAmount' }
    BudgetProposalAdvice:
      type: object
      additionalProperties: false
      required: [provider, shares, modelVersion, promptVersion, taskKind, inputSchemaVersion,
                 outputSchemaVersion, correlationId, executionPolicy, requiredCapabilities,
                 capabilities, latencyMs, usage, fallbackReason, provenance]
      properties:
        provider: { type: string, minLength: 1, maxLength: 64 }
        shares:
          type: object
          minProperties: 1
          maxProperties: 32
          additionalProperties: { type: string, pattern: '^\d{1,3}(?:\.\d{1,2})?$' }
        modelVersion: { type: string, minLength: 1, maxLength: 128 }
        promptVersion: { type: string, minLength: 1, maxLength: 64 }
        taskKind: { type: string, const: budget-proposal }
        inputSchemaVersion: { type: string, const: budget-proposal-context.v1 }
        outputSchemaVersion: { type: string, const: budget-proposal-advice.v1 }
        correlationId: { type: string, format: uuid }
        executionPolicy: { type: string, enum: [local-only, cloud-opt-in] }
        requiredCapabilities:
          type: array
          uniqueItems: true
          items: { type: string, enum: [text, structured_output, vision, embeddings, tool_calling, streaming] }
        capabilities:
          type: array
          uniqueItems: true
          items: { type: string, enum: [text, structured_output, vision, embeddings, tool_calling, streaming] }
        latencyMs: { type: integer, minimum: 0 }
        usage: { $ref: '#/components/schemas/AiUsage' }
        fallbackReason: { type: [string, 'null'] }
        provenance: { $ref: '#/components/schemas/AiProvenance' }
    TransactionDraftContext:
      type: object
      additionalProperties: false
      required: [text, timezone, now]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        now: { type: string, format: date-time }
    ReceiptOcrContext:
      type: object
      additionalProperties: false
      required: [imageBase64]
      properties:
        imageBase64:
          type: string
          minLength: 1
          maxLength: 16777216
          pattern: '^[A-Za-z0-9+/]*={0,2}$'
    ReceiptBasketContext:
      type: object
      additionalProperties: false
