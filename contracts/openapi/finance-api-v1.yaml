components:
  securitySchemes:
    bffSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
    keycloakOidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.example.invalid/realms/finance/.well-known/openid-configuration
    telegramServiceToken:
      type: apiKey
      in: header
      name: X-Finance-Service-Token
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Same tenant, actor, route and key with a different body returns 409.
      schema: { type: string, minLength: 16, maxLength: 128 }
    MerchantReclassificationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Reclassification key is extended with a transaction ID for atomic per-transaction updates.
      schema: { type: string, minLength: 16, maxLength: 80, pattern: '^[A-Za-z0-9._:-]+$' }
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Token returned by the same-origin browser CSRF endpoint.
      schema: { type: string, minLength: 16 }
  responses:
    BadRequest:
      description: Invalid amount, type, category or timestamp
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid OIDC identity
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Current tenant role does not permit this financial mutation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Tenant or transaction does not exist or is not visible
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Idempotency payload mismatch or stale transaction version
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: Transaction version is stale
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    MoneyAmount:
      type: string
      pattern: '^\d{1,18}(?:\.\d{2})$'
    BrowserSession:
      type: object
      additionalProperties: false
      required: [authenticated, displayName]
      properties:
        authenticated: { type: boolean }
        displayName: { type: string }
    CsrfToken:
      type: object
      required: [token, headerName, parameterName]
      properties:
        token: { type: string }
        headerName: { type: string, const: X-XSRF-TOKEN }
        parameterName: { type: string }
    CreateTenant:
      type: object
      additionalProperties: false
      required: [displayName, timezone]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        memberDisplayName: { type: string, minLength: 1, maxLength: 120 }
        plannedIncome: { type: [number, 'null'], exclusiveMinimum: 0, multipleOf: 0.01 }
    TenantMembership:
      type: object
      additionalProperties: false
      required: [tenantId, userId, displayName, role, timezone]
      properties:
        tenantId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        displayName: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
        timezone: { type: string }
    TenantMember:
      type: object
      additionalProperties: false
      required: [userId, displayName, role]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string, maxLength: 120 }
        role: { type: string, enum: [owner, admin, member, viewer] }
    UpdateMemberProfile:
      type: object
      additionalProperties: false
      required: [displayName, plannedIncome, onboardingState]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        plannedIncome: { type: [number, 'null'], exclusiveMinimum: 0, multipleOf: 0.01 }
        onboardingState: { type: string, enum: [started, complete] }
    UpdateNotificationPreferences:
      type: object
      additionalProperties: false
      required: [language, dailyEnabled, dailyLocalTime, weeklyEnabled, weeklyDayOfWeek, weeklyLocalTime,
                 quietHoursStart, quietHoursEnd]
      properties:
        language: { type: string, enum: [ru, en] }
        dailyEnabled: { type: boolean }
        dailyLocalTime: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
        weeklyEnabled: { type: boolean }
        weeklyDayOfWeek: { type: integer, minimum: 1, maximum: 7 }
