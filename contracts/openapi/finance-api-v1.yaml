openapi: 3.1.0
info:
  title: Finance Core API
  version: 1.0.0
  description: Public API shared by React and Android. Java Core owns all financial mutations.
servers:
  - url: http://localhost:8080
    description: Local development only
security:
  - keycloakOidc: []
paths:
  /bff/session:
    get:
      operationId: getBrowserSession
      security: []
      responses:
        '200':
          description: Browser authentication state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserSession' }
  /bff/csrf:
    get:
      operationId: getBrowserCsrfToken
      security: []
      responses:
        '200':
          description: CSRF token for same-origin state-changing requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfToken' }
  /bff/me/tenants:
    get:
      operationId: listBrowserTenants
      security:
        - bffSession: []
      responses:
        '200':
          description: Active memberships for the current browser session
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TenantMembership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /bff/me/telegram-link:
    post:
      operationId: createBrowserTelegramLinkCode
      security:
        - bffSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Short-lived code shown once; only its hash is stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramLinkCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: Link code issue limit reached }
  /bff/tenants:
    post:
      operationId: createBrowserTenant
      security:
        - bffSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTenant' }
      responses:
        '201':
          description: Tenant and initial profile created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantMembership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /bff/tenants/{tenantId}/members:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: listBrowserTenantMembers
      summary: List members available to the current browser role
      security:
        - bffSession: []
      responses:
        '200':
          description: Owner/admin sees active workspace members; other roles see only themselves
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TenantMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /bff/tenants/{tenantId}/transactions:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: listBrowserTransactions
      security:
        - bffSession: []
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: type
          in: query
          schema: { type: string, enum: [expense, income, refund, debt_payment, transfer] }
        - name: search
          in: query
          schema: { type: string, maxLength: 120 }
        - name: memberId
          in: query
          description: Omit for the current member; owners/admins may select an active user ID or all.
          schema:
            oneOf:
              - type: string
                format: uuid
              - type: string
                const: all
      responses:
        '200':
          description: Stable page scoped to current member or manager-selected family member(s)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createBrowserTransaction
      security:
        - bffSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransaction' }
      responses:
        '201':
          description: Created once and committed with its outbox event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /bff/tenants/{tenantId}/transaction-drafts:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: createBrowserTransactionDraft
      security:
        - bffSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionDraftText' }
      responses:
        '201':
          description: AI extraction saved for review; no financial transaction was created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { description: AI output failed validation }
        '503': { description: Local AI service is unavailable }
  /bff/tenants/{tenantId}/imports:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: createBrowserBankImport
      security:
        - bffSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: T-Bank statement PDF up to 12 MiB }
      responses:
        '201':
          description: Parsed statement staged for review; no transactions are created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankImportPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'Unsupported, scanned or malformed statement PDF' }
        '503': { description: Private statement parser is unavailable }
  /bff/tenants/{tenantId}/imports/{importId}/preview:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: importId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getBrowserBankImportPreview
      security:
        - bffSession: []
      responses:
        '200':
          description: Current owner-scoped preview and revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankImportPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bff/tenants/{tenantId}/imports/{importId}/rows/{rowId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: importId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: rowId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: selectBrowserBankImportRow
      security:
        - bffSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankImportRowSelection' }
      responses:
        '200':
          description: Recomputed preview after explicit user row selection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankImportPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /bff/tenants/{tenantId}/imports/{importId}/confirm:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: importId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: confirmBrowserBankImport
      security:
        - bffSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankImportConfirm' }
      responses:
        '200':
          description: Atomically creates transactions and records duplicates for this batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankImportPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /bff/tenants/{tenantId}/imports/{importId}/undo:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: importId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: undoBrowserBankImport
      security:
        - bffSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      responses:
        '200':
          description: Reverts only unchanged transactions created by this import
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankImportUndoResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Batch contains modified transactions and remains committed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankImportUndoResult' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /bff/tenants/{tenantId}/receipts:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: createBrowserReceipt
      security:
        - bffSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReceipt' }
      responses:
        '201':
          description: Created user-reviewed receipt evidence; no financial transaction was posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /bff/tenants/{tenantId}/receipts/photo-jobs:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: uploadBrowserReceiptPhoto
      security: [{ bffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '202': { description: Private receipt photo queued for scan and OCR, content: { application/json: { schema: { $ref: '#/components/schemas/ReceiptProcessingJob' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /bff/tenants/{tenantId}/receipt-jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBrowserReceiptProcessingJob
      security: [{ bffSession: [] }]
      responses:
        '200': { description: Owner-scoped receipt scan/OCR progress, content: { application/json: { schema: { $ref: '#/components/schemas/ReceiptProcessingJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bff/tenants/{tenantId}/receipts/{receiptId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: receiptId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getBrowserReceipt
      security:
        - bffSession: []
      responses:
        '200':
          description: Receipt evidence draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bff/tenants/{tenantId}/receipts/{receiptId}/readings:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: receiptId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getBrowserReceiptOcrReading
      security: [{ bffSession: [] }]
      responses:
        '200': { description: Owner-scoped OCR text and word evidence, content: { application/json: { schema: { $ref: '#/components/schemas/ReceiptOcrReading' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bff/tenants/{tenantId}/receipts/{receiptId}/items:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: receiptId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getBrowserReceiptItems
      security:
        - bffSession: []
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Eight ordered items per page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptItemPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addBrowserReceiptItem
      security:
        - bffSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptItemInput' }
      responses:
        '201':
          description: Item added to the receipt draft; cash total remains unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /bff/tenants/{tenantId}/receipts/{receiptId}/disputed-items:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: receiptId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getBrowserDisputedReceiptItems
      security:
        - bffSession: []
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Harmful or unnecessary receipt lines without an allowed product decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptItemPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bff/tenants/{tenantId}/receipts/{receiptId}/repeat-warnings:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: receiptId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getBrowserReceiptRepeatWarnings
      security:
        - bffSession: []
      responses:
        '200':
          description: Warnings from earlier confirmed receipts; the current receipt is excluded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptRepeatWarnings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bff/tenants/{tenantId}/receipts/{receiptId}/duplicate-candidates:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: receiptId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getBrowserReceiptDuplicateCandidates
      security:
        - bffSession: []
      responses:
        '200':
          description: Same-owner receipts with matching totals created in the prior ten minutes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptDuplicateCandidates' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bff/tenants/{tenantId}/receipts/{receiptId}/duplicate-decision:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: receiptId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: decideBrowserReceiptDuplicate
      security:
        - bffSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptDuplicateDecisionSelection' }
      responses:
        '200':
          description: User decision stored with receipt review history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /bff/tenants/{tenantId}/receipts/{receiptId}/confirm:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: receiptId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: confirmBrowserReceipt
      security:
        - bffSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      responses:
        '200':
          description: Receipt and expense transaction confirmed atomically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /bff/tenants/{tenantId}/receipts/{receiptId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: receiptId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateBrowserReceiptItem
      security:
        - bffSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptItemInput' }
      responses:
        '200':
          description: Item corrected while preserving cash total
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      operationId: deleteBrowserReceiptItem
      security:
        - bffSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      responses:
        '204': { description: Item removed; receipt totals and review history updated atomically }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /bff/tenants/{tenantId}/receipts/{receiptId}/sync-total:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: receiptId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: syncBrowserReceiptTotal
      security:
        - bffSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      responses:
        '200':
          description: Explicitly replace the cash total with the complete item sum
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
