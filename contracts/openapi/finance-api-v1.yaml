        currentUnitPrice: { type: string, pattern: '^\d{1,24}\.\d{6}$' }
        baselineUnitPrice:
          type: [string, 'null']
          pattern: '^\d{1,24}\.\d{6}$'
          description: Median price for matching earlier purchases by this same member; null without history.
        change:
          type: [string, 'null']
          pattern: '^-?\d{1,24}\.\d{6}$'
          description: Current unit price minus the baseline; null without history.
        relative:
          type: [string, 'null']
          pattern: '^-?\d{1,40}\.\d{6}$'
          description: Fractional change from baseline; 0.125000 means 12.5 percent.
        signal: { type: boolean, description: True only when both RUB 10 and 12 percent thresholds are met. }
        direction:
          type: [string, 'null']
          enum: [up, down, null]
          description: Significant movement direction; null when no signal exists.
        priorPurchases:
          type: integer
          minimum: 0
          maximum: 5000
          description: Count of matching earlier purchases for this member.
        history:
          type: array
          maxItems: 5001
          description: Matching price points in time order, followed by the current receipt item.
          items: { $ref: '#/components/schemas/PriceHistoryPoint' }
    PriceHistoryPoint:
      type: object
      additionalProperties: false
      required: [receiptId, itemId, purchasedAt, merchant, name, unitPrice, current]
      properties:
        receiptId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        purchasedAt: { type: string, format: date-time }
        merchant: { type: [string, 'null'], maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 200 }
        unitPrice: { type: string, pattern: '^\d{1,24}\.\d{6}$' }
        current: { type: boolean }
    ReceiptItemPage:
      type: object
      additionalProperties: false
      required: [items, page, totalItems, hasMore]
      properties:
        items:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/ReceiptItem' }
        page: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
    ReceiptOcrReading:
      type: object
      additionalProperties: false
      required: [text, words, provider, modelVersion, promptVersion, confidence,
                 ocrTotal, ocrItems, reconciliation, visionFallbackReason, ocrFallbackReason]
      properties:
        text: { type: string, maxLength: 1024000 }
        words:
          type: array
          maxItems: 4000
          items:
            type: object
            additionalProperties: false
            required: [text, confidence, box]
            properties:
              text: { type: string, minLength: 1, maxLength: 256 }
              confidence: { type: number, minimum: 0, maximum: 100 }
              box:
                type: object
                additionalProperties: false
                required: [x, y, width, height]
                properties:
                  x: { type: integer, minimum: 0 }
                  y: { type: integer, minimum: 0 }
                  width: { type: integer, minimum: 0 }
                  height: { type: integer, minimum: 0 }
        provider:
          oneOf:
            - { type: string, const: tesseract }
            - { type: 'null' }
        modelVersion: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        promptVersion:
          oneOf:
            - { type: string, const: tesseract-ocr.v2 }
            - { type: 'null' }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        ocrTotal: { type: [string, 'null'], pattern: '^\\d{1,18}(?:\\.\\d{1,2})?$' }
        ocrItems:
          type: array
          maxItems: 80
          items: { $ref: '#/components/schemas/ReceiptStructuredLineItem' }
        reconciliation: { $ref: '#/components/schemas/ReceiptReconciliation' }
        visionFallbackReason: { type: [string, 'null'], maxLength: 64 }
        ocrFallbackReason: { type: [string, 'null'], maxLength: 64 }
        vision:
          oneOf:
            - { $ref: '#/components/schemas/ReceiptVisionReading' }
            - { type: 'null' }
    ReceiptVisionReading:
      type: object
      additionalProperties: false
      required: [store, date, total, items, provider, modelVersion, promptVersion, fallbackReason]
      properties:
        store: { type: [string, 'null'], maxLength: 100 }
        date: { type: [string, 'null'], format: date }
        total: { type: [string, 'null'], pattern: '^\\d{1,18}(?:\\.\\d{1,2})?$' }
        items:
          type: array
          maxItems: 80
          items:
            type: object
            additionalProperties: false
            required: [name, quantity, unitPrice, lineSum]
            properties:
              name: { type: string, minLength: 1, maxLength: 200 }
              quantity: { type: [string, 'null'], pattern: '^\\d{1,12}(?:\\.\\d{1,6})?$' }
              unitPrice: { type: [string, 'null'], pattern: '^\\d{1,18}(?:\\.\\d{1,2})?$' }
              lineSum: { type: [string, 'null'], pattern: '^\\d{1,18}(?:\\.\\d{1,2})?$' }
        provider: { type: string, const: ollama }
        modelVersion: { type: string, minLength: 1, maxLength: 128 }
        promptVersion: { type: string, const: receipt-vision.v1 }
        fallbackReason: { type: [string, 'null'], maxLength: 64 }
    ReceiptStructuredLineItem:
      type: object
      additionalProperties: false
      required: [name, quantity, unitPrice, lineSum]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        quantity: { type: [string, 'null'], pattern: '^\\d{1,12}(?:\\.\\d{1,6})?$' }
        unitPrice: { type: [string, 'null'], pattern: '^\\d{1,18}(?:\\.\\d{1,2})?$' }
        lineSum: { type: [string, 'null'], pattern: '^\\d{1,18}(?:\\.\\d{1,2})?$' }
    ReceiptReconciliation:
      type: object
      additionalProperties: false
      required: [algorithmVersion, decision, selectedReader, mismatchFields, ocrItemsTotal, visionItemsTotal,
                 allowedDifference, ocrItemsReconciled, visionItemsReconciled, itemEvidence, suggestedTopUps]
      properties:
        algorithmVersion: { type: string, const: receipt-reconciliation.v1 }
        decision: { type: string, enum: [auto_selected, review_required, insufficient_data] }
        selectedReader: { type: [string, 'null'], enum: [ocr, vision, null] }
        mismatchFields:
          type: array
          uniqueItems: true
          items: { type: string, enum: [total, merchant, date, items] }
        ocrItemsTotal: { type: [string, 'null'], pattern: '^\\d{1,18}(?:\\.\\d{1,2})?$' }
        visionItemsTotal: { type: [string, 'null'], pattern: '^\\d{1,18}(?:\\.\\d{1,2})?$' }
        allowedDifference: { type: [string, 'null'], pattern: '^\\d{1,18}(?:\\.\\d{1,2})?$' }
        ocrItemsReconciled: { type: boolean }
        visionItemsReconciled: { type: boolean }
        itemEvidence:
          type: array
          maxItems: 80
          items: { $ref: '#/components/schemas/ReceiptItemEvidence' }
        suggestedTopUps:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/ReceiptTopUpSuggestion' }
    ReceiptItemEvidence:
      type: object
      additionalProperties: false
      required: [visionOrdinal, ocrOrdinal, status]
      properties:
        visionOrdinal: { type: integer, minimum: 1, maximum: 80 }
        ocrOrdinal: { type: [integer, 'null'], minimum: 1, maximum: 80 }
        status: { type: string, enum: [corroborated, amount_disagrees, amount_unknown, reader_only] }
    ReceiptTopUpSuggestion:
      type: object
      additionalProperties: false
      required: [ocrOrdinal, name, lineSum]
      properties:
        ocrOrdinal: { type: integer, minimum: 1, maximum: 80 }
        name: { type: string, minLength: 1, maxLength: 200 }
        lineSum: { type: string, pattern: '^\\d{1,18}(?:\\.\\d{1,2})?$' }
    ReceiptProcessingJob:
      type: object
      additionalProperties: false
      required: [id, tenantId, documentId, state, stage, progressPercent, attemptCount,
                 retryable, errorCode, receiptId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        state: { type: string, enum: [queued, running, retryable, completed, rejected] }
        stage: { type: string, enum: [queued, scanning, vision, ocr, draft, complete] }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        attemptCount: { type: integer, minimum: 0, maximum: 5 }
        retryable: { type: boolean }
        errorCode: { type: [string, 'null'], maxLength: 64 }
        receiptId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReceiptRepeatWarning:
      type: object
      additionalProperties: false
      required: [itemId, name, productKey, verdict, title, count, lastSum, advice]
      properties:
        itemId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        productKey: { type: string, maxLength: 256 }
        verdict: { type: string, enum: [harmful, unnecessary] }
        title: { type: string, minLength: 1, maxLength: 80 }
        count: { type: integer, minimum: 1 }
        lastSum: { type: string, pattern: '^(?:0|[1-9][0-9]{0,17})\.[0-9]{2}$' }
        advice: { type: [string, 'null'], maxLength: 500 }
    ReceiptRepeatWarnings:
      type: object
      additionalProperties: false
      required: [warnings]
      properties:
        warnings:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ReceiptRepeatWarning' }
    ReceiptDuplicateDecisionSelection:
      type: object
      additionalProperties: false
      required: [decision, duplicateReceiptId]
      properties:
        decision: { type: string, enum: [independent, duplicate] }
        duplicateReceiptId: { type: [string, 'null'], format: uuid }
    ReceiptDuplicateCandidate:
      type: object
      additionalProperties: false
      required: [id, cashTotal, merchant, createdAt]
      properties:
        id: { type: string, format: uuid }
        cashTotal: { type: string, pattern: '^(?:0|[1-9][0-9]{0,17})\.[0-9]{2}$' }
        merchant: { type: [string, 'null'], maxLength: 200 }
        createdAt: { type: string, format: date-time }
    ReceiptDuplicateCandidates:
      type: object
      additionalProperties: false
      required: [receiptId, decision, candidates]
      properties:
        receiptId: { type: string, format: uuid }
        decision: { type: string, enum: [unknown, independent, duplicate] }
        candidates:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ReceiptDuplicateCandidate' }
    UpdateTransactionDraft:
      type: object
      additionalProperties: false
      required: [type, amount, currency, categoryCode, subcategoryCode, description, occurredAt, debtId]
      properties:
        type: { type: string, enum: [expense, income, debt_payment] }
        amount:
          type: string
          pattern: '^(?:0\.(?:[0-9]?[1-9]|[1-9][0-9])|[1-9][0-9]{0,17}(?:\.[0-9]{1,2})?)$'
        currency: { type: string, const: RUB }
        categoryCode: { type: string, minLength: 1, maxLength: 64 }
        subcategoryCode: { type: [string, 'null'], maxLength: 64 }
        description: { type: string, maxLength: 500 }
        occurredAt: { type: string, format: date-time }
        debtId: { type: [string, 'null'], format: uuid }
    TransactionDraft:
      type: object
      additionalProperties: false
      required: [id, tenantId, type, amount, currency, categoryCode, subcategoryCode, description, debtId,
                 occurredAt, state, version, provider, modelVersion, promptVersion, createdAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        type: { type: string, enum: [expense, income, debt_payment] }
        amount:
          type: string
          pattern: '^(?:0\.(?:[0-9]?[1-9]|[1-9][0-9])|[1-9][0-9]{0,17}(?:\.[0-9]{1,2})?)$'
        currency: { type: string, const: RUB }
        categoryCode: { type: string, minLength: 1, maxLength: 64 }
        subcategoryCode: { type: [string, 'null'], maxLength: 64 }
        description: { type: string, maxLength: 500 }
        occurredAt: { type: string, format: date-time }
        debtId: { type: [string, 'null'], format: uuid }
        state: { type: string, enum: [pending, confirmed, cancelled] }
        version: { type: integer, minimum: 1 }
        provider: { type: string, minLength: 1, maxLength: 64 }
        modelVersion: { type: string, minLength: 1, maxLength: 128 }
        promptVersion: { type: string, minLength: 1, maxLength: 64 }
        createdAt: { type: string, format: date-time }
    Transaction:
      type: object
      additionalProperties: false
      required: [id, tenantId, type, amount, currency, categoryCode, description, source, occurredAt, status, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        type: { type: string, enum: [expense, income, refund, debt_payment, transfer] }
        amount: { type: string, pattern: '^(?:0\.(?:[0-9]?[1-9]|[1-9][0-9])|[1-9][0-9]{0,17}(?:\.[0-9]{1,2})?)$' }
        currency: { type: string, const: RUB }
        categoryCode: { type: string, minLength: 1, maxLength: 64 }
        subcategoryCode: { type: [string, 'null'], maxLength: 64 }
        description: { type: string, maxLength: 500 }
        source: { type: string, minLength: 1, maxLength: 64 }
        occurredAt: { type: string, format: date-time }
        accountId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [posted, voided] }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        memberName: { type: [string, 'null'], maxLength: 120 }
        debtId: { type: [string, 'null'], format: uuid }
        ownerUserId: { type: [string, 'null'], format: uuid }
        budgetAlerts:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/BudgetAlert' }
    BudgetAlert:
      type: object
      additionalProperties: false
      required: [budgetKey, threshold, limit, spent]
      properties:
        budgetKey: { type: string, minLength: 1, maxLength: 64, description: "__total__ represents the effective monthly total limit." }
        threshold: { type: string, enum: [near, exceeded] }
        limit: { type: string, pattern: '^\d+\.\d{2}$' }
        spent: { type: string, pattern: '^\d+\.\d{2}$' }
    TransactionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        nextCursor: { type: [string, 'null'] }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        traceId: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
