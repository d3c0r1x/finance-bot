name: Finance Core PostgreSQL checks

on:
  push:
    paths:
      - 'services/core/**'
      - 'tools/contracts/**'
      - '.github/workflows/core-postgres.yml'
  pull_request:
    paths:
      - 'services/core/**'
      - 'tools/contracts/**'
      - '.github/workflows/core-postgres.yml'
  workflow_dispatch:

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6@sha256:0377e72c5289ed2f98cf61b1a9c2db9eb9d300317fe14244492fbc94343b3d04
        env:
          POSTGRES_USER: finance_test
          POSTGRES_PASSWORD: finance_test
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_test -d finance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FINANCE_TEST_DATABASE_URL: postgresql://finance_test:finance_test@localhost:5432/finance_test
      FINANCE_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/finance_test
      FINANCE_TEST_DB_USER: finance_test
      FINANCE_TEST_DB_PASSWORD: finance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/contracts/requirements.txt
      - run: ./gradlew :services:core:check
      - run: python -m pip install -r tools/contracts/requirements.txt
      - run: python -m pytest tools/contracts -q
