name: Finance v2 Python and contract checks

on:
  push:
    paths:
      - 'contracts/**'
      - 'tools/contracts/**'
      - 'services/python/intelligence/**'
      - 'services/python/telegram_gateway/**'
      - 'services/analytics-go/**'
      - 'docs/specs/price-projection-v1.md'
      - 'PLAN.md'
      - 'docs/specs/CONTINUATION.md'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'tools/contracts/**'
      - 'services/python/intelligence/**'
      - 'services/python/telegram_gateway/**'
      - 'services/analytics-go/**'
      - 'docs/specs/price-projection-v1.md'
      - 'PLAN.md'
      - 'docs/specs/CONTINUATION.md'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/contracts/requirements.txt
            services/python/document_import/requirements.txt
            services/python/intelligence/requirements.txt
            services/python/telegram_gateway/requirements.txt
      - run: python -m pip install -r tools/contracts/requirements.txt -r services/python/document_import/requirements.txt -r services/python/intelligence/requirements.txt -r services/python/telegram_gateway/requirements.txt
      - run: python -m pytest tools/contracts/test_contracts.py tools/migration/test_goal_history.py services/python/intelligence/tests services/python/telegram_gateway/tests -q

  go-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/analytics-go/go.mod
          cache-dependency-path: |
            services/analytics-go/go.mod
            services/analytics-go/go.sum
      - run: go test ./...
        working-directory: services/analytics-go
      - run: go vet ./...
        working-directory: services/analytics-go

  go-price-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/analytics-go/go.mod
          cache-dependency-path: |
            services/analytics-go/go.mod
            services/analytics-go/go.sum
      - name: Start ClickHouse test service
        run: |
          docker run -d --name finance-price-clickhouse --ulimit nofile=262144:262144 \
            -p 127.0.0.1:8123:8123 \
            -e CLICKHOUSE_USER=finance_test \
            -e CLICKHOUSE_PASSWORD=integration-only \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            clickhouse/clickhouse-server:26.3
          for attempt in {1..60}; do
            if curl --fail --silent --user finance_test:integration-only http://127.0.0.1:8123/ping; then
              exit 0
            fi
            sleep 2
          done
          docker logs finance-price-clickhouse
          exit 1
      - name: Start Redpanda Kafka test broker
        run: |
          docker network create finance-price-it
          docker run -d --name finance-price-redpanda --network finance-price-it --network-alias redpanda \
            -p 127.0.0.1:19092:19092 -p 127.0.0.1:9644:9644 \
            docker.redpanda.com/redpandadata/redpanda:v26.2.3 \
            redpanda start \
            --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
            --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092 \
            --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082 \
            --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082 \
            --schema-registry-addr internal://0.0.0.0:8081,external://localhost:18081 \
            --rpc-addr redpanda:33145 --advertise-rpc-addr redpanda:33145 \
            --mode dev-container --smp 1
          for attempt in {1..60}; do
            if docker exec finance-price-redpanda rpk cluster health --api-urls redpanda:9644 --exit-when-healthy; then
              exit 0
            fi
            sleep 2
          done
          docker logs finance-price-redpanda
          exit 1
      - name: Verify Kafka to ClickHouse projection and replay
        env:
          FINANCE_PRICE_IT_BROKERS: 127.0.0.1:19092
          FINANCE_PRICE_IT_CLICKHOUSE_URL: http://127.0.0.1:8123
          FINANCE_PRICE_IT_CLICKHOUSE_USER: finance_test
          FINANCE_PRICE_IT_CLICKHOUSE_PASSWORD: integration-only
        run: go test -tags=integration ./cmd/receipt-price-projector -run TestReceiptPriceProjectorKafkaClickHouseIntegration -count=1
        working-directory: services/analytics-go
      - name: Verify recurring transaction projection and replay
        env:
          FINANCE_RECURRING_IT_BROKERS: 127.0.0.1:19092
          FINANCE_RECURRING_IT_CLICKHOUSE_URL: http://127.0.0.1:8123
          FINANCE_RECURRING_IT_CLICKHOUSE_USER: finance_test
          FINANCE_RECURRING_IT_CLICKHOUSE_PASSWORD: integration-only
        run: go test -tags=integration ./cmd/transaction-state-projector -run TestTransactionStateProjectorKafkaClickHouseIntegration -count=1
        working-directory: services/analytics-go
