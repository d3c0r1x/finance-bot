name: Private receipt storage integration

on:
  push:
    paths:
      - 'services/core/**'
      - 'ops/receipt-storage/**'
      - '.github/workflows/receipt-storage.yml'
  pull_request:
    paths:
      - 'services/core/**'
      - 'ops/receipt-storage/**'
      - '.github/workflows/receipt-storage.yml'
  workflow_dispatch:

jobs:
  receipt-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Start authenticated SeaweedFS S3
        run: |
          docker run -d --name finance-receipt-seaweed \
            -p 127.0.0.1:8333:8333 \
            -v "$GITHUB_WORKSPACE/ops/receipt-storage/seaweed-s3-it.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.47 server -s3 -ip.bind=0.0.0.0 \
            -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for attempt in {1..60}; do
            if curl --silent --output /dev/null --max-time 2 http://127.0.0.1:8333/; then
              exit 0
            fi
            sleep 2
          done
          docker logs finance-receipt-seaweed
          exit 1
      - name: Start ClamAV
        run: |
          docker run -d --name finance-receipt-clamav \
            -p 127.0.0.1:3310:3310 \
            -e CLAMAV_NO_MILTERD=true \
            -e CLAMAV_NO_FRESHCLAMD=true \
            -e CLAMD_STARTUP_TIMEOUT=600 \
            clamav/clamav:1.5.4-debian13-slim
          for attempt in {1..180}; do
            if (echo > /dev/tcp/127.0.0.1/3310) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          docker logs finance-receipt-clamav
          exit 1
      - name: Verify private S3 operations and malware scanning
        env:
          FINANCE_RECEIPT_IT_S3_ENDPOINT: http://127.0.0.1:8333
          FINANCE_RECEIPT_IT_S3_ACCESS_KEY: finance-receipt-it-access
          FINANCE_RECEIPT_IT_S3_SECRET_KEY: finance-receipt-it-secret-key
          FINANCE_RECEIPT_IT_CLAMAV_HOST: 127.0.0.1
          FINANCE_RECEIPT_IT_CLAMAV_PORT: '3310'
        run: ./gradlew :services:core:test --tests '*ReceiptStorageIntegrationTest' --no-daemon
      - name: Print integration service logs on failure
        if: failure()
        run: |
          docker logs finance-receipt-seaweed || true
          docker logs finance-receipt-clamav || true
