name: Mobile API and APK
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/test_api.py -q
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: finance-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
        working-directory: mobile_flutter
      - run: flutter analyze
        working-directory: mobile_flutter
      - run: flutter build web
        working-directory: mobile_flutter
      - run: flutter build apk --debug
        working-directory: mobile_flutter
      - uses: actions/upload-artifact@v4
        with:
          name: finpulse-flutter-debug-apk
          path: mobile_flutter/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: finpulse-web
          path: mobile_flutter/build/web
