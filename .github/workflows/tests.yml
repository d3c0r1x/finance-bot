name: Тесты

# Прогоняет три набора проверок на каждый пуш и пул-реквест: до этого о зелёных
# тестах знал только тот, кто запускал их руками, и регрессия могла уехать в main.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Tesseract с русским языком — системная зависимость, без неё чеки не читаются
      - name: Установить Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-rus

      - name: Установить зависимости Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Ollama в CI нет — так и задумано: тесты проверяют работу без модели
      - name: Смоук-тест (модули, БД, аналитика, диаграммы)
        run: python smoke_test.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Тест обработчиков (реальные апдейты через диспетчер)
        run: python handlers_test.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Тест разбора чеков
        run: python receipt_test.py
        env:
          PYTHONIOENCODING: utf-8
